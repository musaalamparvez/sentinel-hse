<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Code Required</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
    }
    .card {
      max-width: 360px;
      margin: 3rem auto 0;
      background: #fff;
      border-radius: 8px;
      padding: 2rem 1.5rem;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 0.75rem;
    }
    p {
      color: #333;
      margin: 0 0 1rem;
    }
    .error {
      color: #b00020;
      font-weight: 600;
    }
    .field {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      max-width: 100%;
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
    }
    button {
      width: 100%;
      font-size: 1rem;
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 4px;
      background: #1a1a1a;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Access code required</h1>
    {% if invalid %}
      <p class="error">That code isn't valid. Please try again.</p>
    {% else %}
      <p>Enter the access code to continue.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="id_code">Access code</label>
        <input type="password" id="id_code" name="code" autocomplete="off" autofocus>
      </div>
      <button type="submit">Continue</button>
    </form>
  </div>
</body>
</html>
